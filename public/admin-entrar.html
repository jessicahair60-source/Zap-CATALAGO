<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administração · Zap Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/site.css">
<style>
  body { background: #241820; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 28px 20px; }
  .box { width: 100%; max-width: 400px; }
  .head { color: #fff; margin-bottom: 18px; }
  .head .logo { color: #fff; }
  .head small { display: block; margin-top: 10px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #C9AFBC; }
  h1 { font-size: 24px; margin: 0 0 2px; }
  form .btn { width: 100%; margin-top: 18px; padding: 15px; }
  .switch { display: block; margin-top: 14px; text-align: center; font-size: 13px; background: none; border: 0; color: var(--acc); cursor: pointer; width: 100%; font-family: inherit; }
  .back { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: #C9AFBC; }
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="head"><span class="logo"><i>Z</i>Zap Catálogo</span><small>Administração da plataforma</small></div>
    <div class="card">
      <form id="f-in">
        <h1>Entrar</h1>
        <p class="note" style="margin:0">Área só da administração. Lojistas entram pelo site.</p>
        <div class="field"><label for="ie">E-mail</label><input class="in" id="ie" type="email" autocomplete="username" required></div>
        <div class="field"><label for="ip">Senha</label><input class="in" id="ip" type="password" autocomplete="current-password" required></div>
        <p class="err" id="ierr" hidden></p>
        <button class="btn" type="submit">Entrar</button>
        <button class="switch" type="button" id="go-up">Primeiro acesso? Criar minha senha</button>
      </form>

      <form id="f-up" hidden>
        <h1>Primeiro acesso</h1>
        <p class="note" style="margin:0">Só funciona com um e-mail autorizado como administração da plataforma.</p>
        <div class="field"><label for="un">Seu nome</label><input class="in" id="un" autocomplete="name" required></div>
        <div class="field"><label for="ue">E-mail</label><input class="in" id="ue" type="email" autocomplete="username" required></div>
        <div class="field"><label for="up">Crie uma senha</label><input class="in" id="up" type="password" autocomplete="new-password" minlength="10" required placeholder="10 caracteres ou mais"></div>
        <p class="err" id="uerr" hidden></p>
        <button class="btn" type="submit">Criar senha e entrar</button>
        <button class="switch" type="button" id="go-in">Já tenho senha</button>
      </form>
    </div>
    <a class="back" href="/">Voltar para o site</a>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const tab = up => { $('#f-in').hidden = up; $('#f-up').hidden = !up; };
$('#go-up').onclick = () => tab(true); $('#go-in').onclick = () => tab(false);
async function send(url, body, errEl, btn) {
  errEl.hidden = true; btn.disabled = true;
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Algo deu errado. Tente de novo.');
    location.reload();
  } catch (e) { errEl.textContent = e.message; errEl.hidden = false; btn.disabled = false; }
}
$('#f-in').onsubmit = e => { e.preventDefault(); send('/api/login', { email: $('#ie').value, password: $('#ip').value, admin: true }, $('#ierr'), $('#f-in .btn')); };
$('#f-up').onsubmit = e => { e.preventDefault(); send('/api/admin/setup', { name: $('#un').value, email: $('#ue').value, password: $('#up').value }, $('#uerr'), $('#f-up .btn')); };
</script>
</body>
</html>
