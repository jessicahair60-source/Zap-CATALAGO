<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Layout: coluna de celular (max 480px). A vitrine usa as cores da lojista (--c-*), o painel usa uma paleta neutra fixa (--p-*). Tema claro por escolha. */
:root {
  color-scheme: light;
  --c-bg: #FCE4EC; --c-text: #4A2B38; --c-title: #2B1520; --c-muted: #94707F;
  --c-bannerBg: #E0457B; --c-bannerText: #FFFFFF;
  --c-linkBg: #FFFFFF; --c-linkText: #2B1520; --c-linkBorder: #F5C6D6;
  --c-searchBg: #FFFFFF; --c-catRing: #E0457B; --c-catText: #4A2B38;
  --c-cardBg: #FFFFFF; --c-cardBorder: #F6CFDC; --c-name: #2B1520; --c-price: #2B1520;
  --c-buyBg: #E0457B; --c-buyText: #FFFFFF; --c-cartBg: #1FA855; --c-cartText: #FFFFFF;
  --c-videoRing: #E0457B; --c-bNew: #1FA855; --c-bTop: #C2185B; --c-bPromo: #E06A00; --c-badgeText: #FFFFFF;
  --ig-grad: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
  --p-bg: #F7F4F6; --p-surface: #FFFFFF; --p-fg: #24181E; --p-muted: #76666E; --p-line: #E9DFE4; --p-soft: #F2ECEF; --p-acc: #B0306A;
  --shadow: 0 8px 30px rgba(60, 20, 40, .14);
  --r-card: 16px; --r-btn: 12px; --r-link: 999px; --r-banner: 18px;
  --f-title: var(--f-display);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "DM Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--c-bg); color: var(--c-text); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body.painel { background: var(--p-bg); color: var(--p-fg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--c-buyBg); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--p-surface); border-bottom: 1px solid var(--p-line); color: var(--p-fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--p-surface); }
.topbar-in { max-width: 480px; margin: 0 auto; display: flex; gap: 6px; padding-block: 8px; align-items: center; }
.demo-tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--p-muted); margin-right: auto; }
.seg { display: flex; background: var(--p-soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--p-muted); }
.seg button[aria-pressed="true"] { background: var(--p-surface); color: var(--p-fg); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

.wrap { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }

/* Banner e texto */
html, body { overflow-x: clip; }
.banner { position: relative; width: 100vw; max-width: 100vw; margin: 0 0 0 calc(50% - 50vw); aspect-ratio: 16/9; border-radius: 0; overflow: hidden;
  background: radial-gradient(90% 120% at 85% 10%, rgba(255,255,255,.35) 0%, transparent 60%), var(--c-bannerBg); }
.banner picture { position: absolute; inset: 0; }
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner .bdeco { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 22px max(20px, env(safe-area-inset-left, 0px)); color: var(--c-bannerText); }
@media (min-width: 760px) { .banner { aspect-ratio: 16/5; } .banner .bdeco { padding: 32px max(32px, calc(50vw - 600px)); } .banner .bdeco strong { font-size: 44px; } .banner .bdeco small { font-size: 13px; } }
.banner .bdeco small { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.banner .bdeco strong { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; }
.intro { padding: 12px 2px 0; }
.store-name { font-family: var(--f-display); font-weight: 800; font-size: 21px; line-height: 1.15; margin: 0; color: var(--c-title); text-wrap: balance; }
.bio { margin: 3px 0 0; color: var(--c-muted); font-size: 14px; }
.perks { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; margin: 16px 0 0; padding: 12px 6px; border-top: 1px solid var(--c-cardBorder); border-bottom: 1px solid var(--c-cardBorder); }
.perks div { display: grid; justify-items: center; gap: 5px; text-align: center; font-size: 11px; line-height: 1.25; font-weight: 600; color: var(--c-title); letter-spacing: .02em; }
.perks svg { width: 22px; height: 22px; color: var(--c-buyBg); }

/* Links */
.links { display: grid; gap: 9px; margin: 14px 0 4px; }
.link { position: relative; display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 6px 52px; border-radius: var(--r-link);
  text-decoration: none; color: var(--c-linkText); background: var(--c-linkBg); border: 1px solid var(--c-linkBorder); font-size: 15px; font-weight: 600;
  box-shadow: 0 1px 2px rgba(60,20,40,.06); transition: transform .15s, box-shadow .15s; }
.link:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.link .ico { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); }
.link .dots { position: absolute; right: 16px; top: 50%; width: 18px; height: 18px; margin-top: -9px; opacity: .45; transition: transform .25s ease, opacity .25s; }
.link .dots svg { width: 100%; height: 100%; display: block; }
.link:hover .dots, .link:focus-visible .dots { transform: translateX(3px); opacity: .8; }
.links-h { text-align: center; margin: 18px 0 2px; }
.links-h b { display: block; font: 700 13px var(--f-title); letter-spacing: .14em; text-transform: uppercase; color: var(--c-title); }
.links-h small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--c-muted); }
.sarr { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -.15em; margin-left: 8px; color: var(--c-buyBg); animation: sarr 1.8s ease-in-out infinite; }
.sarr svg { width: 100%; height: 100%; display: block; }
@keyframes sarr { 0%, 100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(4px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sarr { animation: none; } }
.ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ico svg { width: 21px; height: 21px; }
.ico-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); color: #fff; }
.ico-tt { background: #000; }
.ico-zap { background: #25D366; color: #fff; }
.ico-map { background: #fff; border: 1px solid #eee; }
.ico-site { background: #3B6FD8; color: #fff; } .ico-yt { background: #FF0000; color: #fff; } .ico-link { background: var(--c-buyBg); color: var(--c-buyText); }
.r45 .thumb, .r45 .slide, .r45 .pslide, .r45 .mthumb { aspect-ratio: 4/5; }

/* Busca e categorias */
.cat-title { font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; color: var(--c-title); margin: 22px 0 0; text-align: center; text-wrap: balance; }
.search { display: flex; gap: 8px; align-items: center; background: var(--c-searchBg); border: 1px solid var(--c-cardBorder); border-radius: var(--r-btn); padding: 0 12px; margin-top: 14px; }
.search svg { width: 18px; height: 18px; opacity: .55; flex: none; }
.search input { border: 0; background: transparent; padding: 11px 0; width: 100%; outline: none; }
.cats { display: flex; gap: 14px; overflow-x: auto; padding: 14px 2px 6px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; border: 0; background: none; padding: 0; display: grid; justify-items: center; gap: 5px; width: 66px; font-size: 11.5px; color: var(--c-catText); }
.ring { display: block; border-radius: 50%; padding: 2.5px; background: var(--c-cardBorder); }
.ring > span { display: block; width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid var(--c-bg); overflow: hidden; position: relative; background: var(--c-cardBg); }
.ring .ph, .ring img, .ring video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; font-size: 16px; }
.cat .ring { width: 64px; height: 64px; }
.cat[aria-pressed="true"] .ring { background: var(--c-catRing); }
.igring .cat[aria-pressed="true"] .ring { background: var(--ig-grad); }
.cat .all { display: grid; place-items: center; height: 100%; color: var(--c-catText); }
.cat .all svg { width: 22px; height: 22px; }
.cat em { font-style: normal; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat[aria-pressed="true"] em { font-weight: 700; }
.sortrow { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; font-size: 13px; color: var(--c-muted); }
.sortrow select { border: 1px solid var(--c-cardBorder); background: var(--c-searchBg); border-radius: 8px; padding: 5px 8px; font-size: 13px; color: var(--c-text); }

/* Produtos */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lst { display: grid; gap: 10px; }
.card { background: var(--c-cardBg); border: 1px solid var(--c-cardBorder); border-radius: var(--r-card); overflow: hidden; min-width: 0; color: var(--c-text); }
.grid .card { display: flex; flex-direction: column; }
.lst .card { display: grid; grid-template-columns: 116px minmax(0, 1fr); }
.thumb { position: relative; aspect-ratio: 9/16; max-width: 100%; border: 0; padding: 0; display: block; width: 100%; background: var(--c-cardBorder); }
.lst .thumb { border-radius: var(--r-btn); overflow: hidden; margin: 8px 0 8px 8px; width: calc(100% - 8px); }
.thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vplay { position: absolute; right: 8px; bottom: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; display: grid; place-items: center; pointer-events: none; }
.mini .vplay, .ring .vplay { display: none; }
.thumb .ph, .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph { display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 40px; color: rgba(255,255,255,.9); }
.badge { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; color: var(--c-badgeText); padding: 3px 8px; border-radius: 6px; letter-spacing: .02em; }
.b-new { background: var(--c-bNew); } .b-top { background: var(--c-bTop); } .b-promo { background: var(--c-bPromo); }
.lst .badge { font-size: 10px; padding: 2px 6px; top: 6px; left: 6px; }
.off { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; background: #fff; color: var(--c-bPromo); padding: 3px 7px; border-radius: 6px; }
.lst .off { display: none; }
.esg { position: absolute; inset: auto 0 0 0; background: rgba(20,10,15,.62); color: #fff; font-size: 12px; text-align: center; padding: 5px; font-weight: 700; letter-spacing: .04em; }
.cbody { padding: 10px 10px 12px; display: grid; gap: 4px; flex: 1; align-content: start; min-width: 0; }
.lst .cbody { padding: 10px 12px 12px; }
.grid .cbody { display: flex; flex-direction: column; }
.grid .buy { margin-top: auto; }
.pname { font-weight: 600; font-size: 14px; line-height: 1.25; color: var(--c-name); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pdesc { font-size: 12.5px; color: var(--c-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.price { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--c-price); font-variant-numeric: tabular-nums; }
.old { color: var(--c-muted); text-decoration: line-through; font-size: 12px; font-family: var(--f-body); font-weight: 400; margin-left: 4px; }
.kind { font-size: 11.5px; font-weight: 600; color: var(--c-muted); letter-spacing: .02em; }
.from { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--c-muted); line-height: 1.1; }
.inst, .stk { font-size: 11.5px; color: var(--c-muted); }
.stk b { color: var(--c-bPromo); }
.vid { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; text-align: left; color: var(--c-text); font-size: 12px; font-weight: 600; line-height: 1.2; }
.vid .ring { width: 42px; height: 42px; flex: none; background: var(--c-videoRing); }
.igvid .vid .ring { background: var(--ig-grad); }
.vid .ring > span { border-color: var(--c-cardBg); }
.sheet .vid { font-size: 14px; }
.sheet .vid .ring { width: 54px; height: 54px; }
.buy { margin-top: 6px; }
.buy { border: 0; border-radius: var(--r-btn); padding: 12px 10px; font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; width: 100%;
  background: var(--c-buyBg); color: var(--c-buyText); display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px; }
.buy:disabled { opacity: .45; cursor: not-allowed; }
.empty { grid-column: 1 / -1; text-align: center; padding: 30px 10px; color: var(--c-muted); }
.foot { text-align: center; font-size: 12px; color: var(--c-muted); margin-top: 30px; }

/* Bolinha flutuante de vídeo */
.vbub { position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 29; display: grid; justify-items: center; gap: 6px;
  background: none; border: 0; padding: 0; width: 92px; cursor: pointer; transition: bottom .25s; animation: vbin .5s ease both; }
.hascart .vbub { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
.vbub-v { position: relative; width: 78px; height: 78px; border-radius: 50%; overflow: hidden; background: #000; box-shadow: 0 0 0 3px var(--c-buyBg, #B9476F), 0 0 0 5px #fff, 0 8px 22px rgba(0,0,0,.25); }
.vbub-v video { width: 100%; height: 100%; object-fit: cover; display: block; }
.vbub-v i { position: absolute; inset: auto 0 6px; display: grid; place-items: center; } .vbub-v i svg { width: 18px; height: 18px; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.vbub-t { background: var(--c-buyBg, #B9476F); color: var(--c-buyText, #fff); font-size: 11px; font-weight: 700; line-height: 1.2; padding: 5px 8px; border-radius: 10px; text-align: center; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.vbub-x { position: absolute; top: -4px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #fff; color: #333; font-size: 15px; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,.25); display: grid; place-items: center; padding: 0; }
@keyframes vbin { from { opacity: 0; transform: translateY(16px) scale(.9); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .vbub { animation: none; } }

/* Carrinho */
.cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--c-bg) 70%, transparent); }
.cartbar button { display: flex; width: 100%; max-width: 480px; margin: 0 auto; background: var(--c-cartBg); color: var(--c-cartText); border: 0; border-radius: var(--r-btn); padding: 15px 18px;
  font-weight: 700; align-items: center; gap: 10px; box-shadow: var(--shadow); font-size: 15px; }
.cartbar .cnt { background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 9px; font-size: 13px; }
.cartbar .tot { margin-left: auto; font-variant-numeric: tabular-nums; }
.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.04); } }

/* Gavetas */
.scrim { position: fixed; inset: 0; background: rgba(15,6,10,.5); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 94%; overflow-y: auto; background: var(--c-cardBg); color: var(--c-text);
  border-radius: 20px 20px 0 0; box-shadow: var(--shadow); max-width: 520px; margin: 0 auto;
  padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); animation: up .25s ease; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } }
.grab { width: 40px; height: 4px; background: var(--c-cardBorder); border-radius: 4px; margin: 10px auto 6px; }
.sheet h3 { font-family: var(--f-display); font-size: 21px; margin: 6px 0 4px; color: var(--c-title); }
.x { position: sticky; top: 8px; float: right; z-index: 3; border: 0; background: rgba(255,255,255,.9); color: #222; width: 32px; height: 32px; border-radius: 50%; margin-top: 8px; font-size: 18px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.car { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin-top: 8px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.slide { position: relative; flex: none; width: min(78%, 300px); aspect-ratio: 9/16; max-width: 100%; border-radius: var(--r-card); overflow: hidden; scroll-snap-align: center; background: #000; }
.car.single .slide { width: min(70%, 280px); margin: 0 auto; }
.slide .ph, .slide img, .slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slide .vtag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; pointer-events: none; }
.opt-label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--c-muted); margin: 14px 0 6px; font-weight: 700; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { border: 1px solid var(--c-cardBorder); background: var(--c-cardBg); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--c-text); }
.opt[aria-pressed="true"] { border-color: var(--c-buyBg); box-shadow: inset 0 0 0 1px var(--c-buyBg); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--c-cardBorder); border-radius: 10px; overflow: hidden; }
.qty button { border: 0; background: var(--c-bg); width: 36px; height: 36px; font-size: 18px; color: var(--c-text); }
.qty span { min-width: 34px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; align-items: center; }
.desc { color: var(--c-muted); margin: 8px 0 0; }
.btn { border: 0; border-radius: 12px; padding: 12px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn svg { width: 17px; height: 17px; }
.btn-cart { background: var(--c-cartBg); color: var(--c-cartText); }
.btn-soft { background: var(--c-bg); color: var(--c-text); }
.full { width: 100%; padding: 15px; font-size: 15px; margin-top: 14px; border-radius: 14px; }
.citem { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--c-cardBorder); }
.citem .mini { width: 48px; aspect-ratio: 9/16; border-radius: 8px; overflow: hidden; position: relative; }
.mini .ph, .mini img, .mini video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; font-size: 14px; }
.citem .nm { font-weight: 600; font-size: 14px; }
.citem .vr { font-size: 12px; color: var(--c-muted); }
.citem .qty button { width: 28px; height: 28px; font-size: 15px; }
.citem .qty span { min-width: 26px; font-size: 13px; }
.sum { display: grid; gap: 4px; margin: 12px 0; font-variant-numeric: tabular-nums; }
.sum div { display: flex; justify-content: space-between; }
.sum .big { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--c-title); }
.coupon { display: flex; gap: 8px; margin-top: 10px; }
.coupon input { flex: 1; min-width: 0; }
.ok { color: #1B8A4A; font-size: 13px; font-weight: 600; }
.err { color: #C62828; font-size: 13px; font-weight: 600; }
.field { display: grid; gap: 4px; margin-top: 10px; min-width: 0; }
.field > label { font-size: 13px; font-weight: 600; }
.in { border: 1px solid var(--c-cardBorder); background: var(--c-bg); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; color: var(--c-text); }
.radios { display: flex; gap: 8px; flex-wrap: wrap; }
.msg { white-space: pre-wrap; background: var(--c-bg); border-radius: 12px; padding: 12px; font-size: 13px; max-height: 220px; overflow: auto; margin-top: 10px; user-select: all; }
.note { font-size: 12px; color: var(--c-muted); margin-top: 8px; }

.lst .cbody { padding: 2px 0 2px 14px; }
.lst { gap: 18px; }
.grid { row-gap: 24px; }
.pp-add { flex: none; width: 54px; padding: 0; border: 1px solid var(--c-cardBorder); background: var(--c-cardBg); color: var(--c-title); border-radius: var(--r-btn); }

@media (min-width: 640px) {

  .sheet { top: 0; bottom: 0; margin: auto; height: fit-content; max-height: 92vh; max-width: 600px; border-radius: 20px; padding-bottom: 22px; }

}
@media (min-width: 1000px) {

#view-painel details[hidden], #view-painel h3[hidden] { display: none !important; }
.mainc { display: flex; flex-wrap: wrap; gap: 10px; }
.sw1 { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--p-surface); box-shadow: 0 0 0 1.5px var(--p-line); padding: 0; cursor: pointer; }

.fine { margin-top: 16px; border-top: 1px solid var(--p-line); padding-top: 12px; }

  body.painel.pv-on .ptabs { left: calc(50% - 190px); } }

/* Prévia ao vivo no painel */
.is-pv .topbar, .is-pv body::before { display: none; }

.pv { position: fixed; z-index: 70; right: 16px; bottom: 16px; display: none; --k: .36; }

.pv-phone { width: calc(390px * var(--k)); height: calc(800px * var(--k)); border-radius: calc(46px * var(--k) + 6px); border: 6px solid #1d1418; overflow: hidden;

.pv-phone::before { content: ""; position: absolute; z-index: 2; top: calc(10px * var(--k)); left: 50%; width: calc(110px * var(--k)); height: calc(30px * var(--k)); transform: translateX(-50%);
  border-radius: 999px; background: #1d1418; pointer-events: none; }
.pv-phone iframe { width: 390px; height: 800px; border: 0; transform: scale(var(--k)); transform-origin: 0 0; display: block; background: #fff; }
.pv-mini .pv-phone iframe { pointer-events: none; }
.pv-mini .pv-phone { cursor: zoom-in; }
.pv-hint { font-size: 11px; color: var(--p-muted); text-align: center; padding: 8px 4px 2px; max-width: calc(390px * var(--k) + 12px); }

@media (min-width: 1100px) {

/* Fotos e vídeos ficam no IndexedDB do navegador; MEDIA guarda o endereço de cada arquivo para exibir */
const MEDIA = { demo: DEMO_VIDEO };
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('vitrinezap', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('m', mode); const out = fn(t.objectStore('m')); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); };
  return {
    put: (id, blob) => tx('readwrite', s => s.put(blob, id)).catch(() => {}),
    del: id => tx('readwrite', s => s.delete(id)).catch(() => {}),
    loadAll: async () => { try { const db = await open(); await new Promise(res => { const c = db.transaction('m').objectStore('m').openCursor();
      c.onsuccess = () => { const cur = c.result; if (!cur) return res(); MEDIA[cur.key] = URL.createObjectURL(cur.value); cur.continue(); }; c.onerror = () => res(); }); } catch (e) {} }
  };
})();
const toBlob = (file, max, png) => new Promise(res => {
  const u = URL.createObjectURL(file); const im = new Image();
  im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); c.toBlob(b => res(b || file), png ? 'image/png' : 'image/jpeg', .85); };
  im.onerror = () => res(file); im.src = u;
});
async function storeFile(file) {
  const type = file.type.startsWith('video') ? 'video' : 'img';
  if (type === 'video' && file.size > 150 * 1024 * 1024) { toast('Esse vídeo passa de 150 MB. Envie um vídeo mais curto.'); return null; }
  const blob = type === 'img' ? await toBlob(file, 1440) : file;
  if (MODE === 'panel') {
    try {
      const r = await fetch('/api/media', { method: 'POST', headers: { 'Content-Type': blob.type || file.type || (type === 'video' ? 'video/mp4' : 'image/jpeg') }, body: blob });
      const j = await r.json(); if (!r.ok) { toast(j.error || 'Não deu para enviar o arquivo.'); return null; }
      MEDIA[j.id] = j.url; return { id: j.id, type: j.type };
    } catch (e) { toast('Não deu para enviar o arquivo. Confira a internet.'); return null; }
  }
  const id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  MEDIA[id] = URL.createObjectURL(blob); idb.put(id, blob);
  return { id, type };
}

}

function firstSteps() {
  const s = S.store;
  const steps = [
    ['info', 'Informações da loja', 'Nome, WhatsApp, frase e links', String(s.phone || '').replace(/\D/g, '').length >= 12],
    ['banner', 'Banner, logo e cores', 'Deixe a vitrine com a cara da sua marca', !!(s.bannerImg || s.bannerImgM || s.logo || s.logoText)],
    ['prod', 'Subir produtos', 'Fotos, vídeos, preços e categorias', S.products.some(p => !p.demo)]];
  const done = steps.filter(x => x[3]).length;
  return `<section class="fsteps"><div class="fs-top"><b>${done === 3 ? 'Sua loja está pronta 🎉' : 'Crie a sua loja em 3 passos'}</b><span>${done} de 3</span></div>

}

const DAYMS = 864e5;
function planDates() {
  const st = BOOT.store, now = Date.now();
  if (st.plan === 'pro') return { since: st.proSince || st.createdAt, until: st.proUntil };
  if (st.plan === 'trial') return { since: st.createdAt, until: st.trialUntil };
  if (st.plan === 'expired') return { since: st.proSince || st.createdAt, until: st.proUntil || st.trialUntil, gone: true };
  return { since: st.createdAt, until: null };
}

async function loadStats() {

/* Painel simples: quem está começando vê só o básico; "Mais opções" mostra o resto */

const PANEL_LAYOUT = [

  ['loja', 'Passo 1 · Informações da loja', 'Nome, WhatsApp, links e como o pedido chega', ['info', 'pedido', 'links']],
  ['visual', 'Passo 2 · Banner, logo e cores', 'Deixe a vitrine com a cara da sua marca', ['banner', 'tema', 'layout']],
  ['visual', 'Mais ajustes', 'Cores de cada parte, depoimentos e rodapé', ['cores', 'depo', 'rodape']],
  ['produtos', 'Passo 3 · Subir produtos', 'Cadastre e organize o seu catálogo', ['prod', 'lista', 'cats', 'estoque', 'selos', 'whats']],

  ['conta', 'Sua conta', '', ['assinatura', 'conta']],

const PANEL_HIDE = ['pix', 'marketing', 'dominio', 'medidas', 'modelo'];
function applySimple() {
  const box = $('#view-painel');
  const firstH = box.querySelector(':scope > h3.pgroup'); if (!firstH) return;
  const tail = [...box.querySelectorAll(':scope > .legal')];

  box.querySelectorAll(':scope > h3.pgroup, :scope > .moreopts').forEach(h => h.remove());
  PANEL_LAYOUT.forEach(([tab, title, sub, ids]) => {
    const list = ids.map(id => secs[id]).filter(Boolean); if (!list.length) return;
    const h = document.createElement('h3'); h.className = 'pgroup'; h.dataset.ptab = tab; h.innerHTML = `${title}${sub ? `<small>${sub}</small>` : ''}`;
    box.append(h, ...list); list.forEach(d => { d.dataset.ptab = tab; delete secs[d.dataset.sec]; });
  });
  Object.values(secs).forEach(d => { d.dataset.ptab = 'conta'; box.append(d); }); // qualquer parte nova não some

/* Abas: cada grupo do painel fica numa aba da barra de baixo */
const PTABS = [
  ['inicio', 'Início', '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],

  ['visual', '2 · Visual', '<circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/><path d="M12 21a2.5 2.5 0 0 1 0-5h2a3 3 0 0 0 3-3"/>'],
  ['produtos', '3 · Produtos', '<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>'],
  ['conta', 'Conta', '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>']];
pui.tab = 'inicio';
function setTab(t, top) {
  pui.tab = t; document.body.dataset.ptab = t; if (!PV && $('#pv')) pvFit();
  $('#view-painel').querySelectorAll(':scope > *').forEach(el => el.classList.toggle('offtab', el.dataset.tab !== t && !(el.dataset.tab === 'all' && t !== 'inicio')));
  document.querySelectorAll('.ptabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === t ? 'page' : 'false'));

function applyTabs() {
  const box = $('#view-painel'); let cur = 'inicio';
  box.querySelectorAll(':scope > *').forEach(el => {

    nav.innerHTML = PTABS.map(([k, l, d]) => `<button data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>${l}</button>`).join('');
    nav.querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.tab === 'inicio') { pui.tab = 'inicio'; renderPainel(); } setTab(b.dataset.tab, true); });
    document.body.appendChild(nav);

{ const rp0 = renderPainel; renderPainel = function () { rp0.apply(this, arguments); applySimple(); if (!PV) applyTabs(); }; }

/* Prévia ao vivo: a mesma página roda num mini celular e recebe os dados a cada mudança */
const pv = { frame: null, t: 0 };
// dentro da prévia nada é salvo; no painel, cada save() também atualiza a prévia
if (PV) save = () => {}; else { const save0 = save; save = function () { pvPush(); return save0.apply(this, arguments); }; }
function pvState() {
  const c = JSON.parse(JSON.stringify(S));
  const d = pui.draft;
  if (d && String(d.name || '').trim()) {
    const n = v => { const x = parseFloat(String(v ?? '').replace(/\./g, '').replace(',', '.')); return x > 0 ? x : 0; };
    const p = { ...JSON.parse(JSON.stringify(d)), id: pui.editId || -1, price: n(d.price), old: n(d.old), stock: d.stock === '' ? '' : +d.stock };
    const i = c.products.findIndex(x => x.id === pui.editId);
    if (i >= 0) c.products[i] = p; else c.products.unshift(p);
  }
  const m = {}; for (const k in MEDIA) if (String(MEDIA[k]).startsWith('blob:')) m[k] = MEDIA[k];
  return { t: 'vzS', S: c, M: m };
}
function pvPush() {
  if (PV || !pv.frame) return;
  clearTimeout(pv.t); pv.t = setTimeout(() => { try { pv.frame.contentWindow.postMessage(pvState(), '*'); } catch (e) {} }, 120);
}
function pvFit() {
  const box = $('#pv'); const mob = innerWidth < 1100;
  document.body.style.setProperty('--tb', $('.topbar').offsetHeight + 'px');
  if (box.classList.contains('big')) box.style.setProperty('--k', Math.min((innerWidth - 60) / 390, (innerHeight - 120) / 800, 1).toFixed(3));
  else if (mob) box.style.setProperty('--k', (box.classList.contains('typing') ? Math.max(.16, innerHeight * .15 / 800) : Math.min(.36, innerHeight * .3 / 800)).toFixed(3));
  else box.style.removeProperty('--k');
  requestAnimationFrame(() => document.body.style.setProperty('--pvh', mob && document.body.classList.contains('pv-on') && !box.classList.contains('big') && getComputedStyle(box).display !== 'none' ? box.offsetHeight + 'px' : '0px'));
  setTimeout(() => document.body.style.setProperty('--pvh', mob && document.body.classList.contains('pv-on') && !box.classList.contains('big') && getComputedStyle(box).display !== 'none' ? box.offsetHeight + 'px' : '0px'), 260);
}
function pvOpen(on) {

  try { localStorage.setItem('vz-pv', on ? '1' : '0'); } catch (e) {}
  if (!on) { $('#pv').classList.remove('big'); pvFit(); return; }

    pv.frame = document.createElement('iframe'); pv.frame.name = 'vzpreview'; pv.frame.title = 'Prévia da vitrine'; pv.frame.tabIndex = -1;
    pv.frame.onload = pvPush; if (window.__BOOT__) pv.frame.src = location.pathname; else pv.frame.srcdoc = PV_SRC; $('#pvphone').appendChild(pv.frame);
  } else pvPush();
  $('#pv').classList.toggle('pv-mini', innerWidth < 1100); pvFit();
}
if (PV) {
  addEventListener('message', e => {
    if (e.source !== parent || !e.data || e.data.t !== 'vzS') return;
    Object.assign(MEDIA, e.data.M || {}); S = e.data.S; applyColors(); renderLoja(); updateCartBar();
  });
} else {
  $('#pvtab').onclick = () => pvOpen(true);
  $('#pvclose').onclick = () => pvOpen(false);
  const big = on => { $('#pv').classList.toggle('big', on); pvFit(); };
  $('#pvbig').onclick = () => big(true);
  $('#pvsmall').onclick = () => big(false);
  $('#pvphone').onclick = () => { if ($('#pv').classList.contains('pv-mini') && !$('#pv').classList.contains('big')) big(true); };
  $('#pv').onclick = e => { if (e.target.id === 'pv') big(false); };
  addEventListener('resize', () => { pvFit(); $('#pv').classList.toggle('pv-mini', innerWidth < 1100); });
  // a barra do topo muda de altura quando o painel carrega: a prévia acompanha
  if (window.ResizeObserver) new ResizeObserver(() => { if (document.body.classList.contains('pv-on')) pvFit(); }).observe($('.topbar'));
  // rascunho do produto e campos sem save() também atualizam a prévia
  const typing = () => { const a = document.activeElement; return !!(a && a.closest('#view-painel') && (a.matches('textarea, select') || (a.matches('input') && !/checkbox|radio|file|color|range/.test(a.type)))); };
  document.addEventListener('focusin', () => { const t = typing(); if (t !== $('#pv').classList.contains('typing')) { $('#pv').classList.toggle('typing', t); pvFit(); } });
  document.addEventListener('focusout', () => setTimeout(() => { const t = typing(); if (t !== $('#pv').classList.contains('typing')) { $('#pv').classList.toggle('typing', t); pvFit(); } }, 120));
  document.addEventListener('input', e => { if (e.target.closest('#view-painel')) pvPush(); });
  document.addEventListener('change', e => { if (e.target.closest('#view-painel')) pvPush(); });
  let pref = '1'; try { pref = localStorage.getItem('vz-pv') ?? pref; } catch (e) {}
  if (pref === '1') pvOpen(true);
}

$('#tab-painel').onclick = () => show('painel');

// App no celular: instalar na tela inicial (Android mostra o botão; no iPhone, explica o caminho)
if (MODE === 'panel' && !PV) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let bip = null; let hideInst = false; try { hideInst = localStorage.getItem('vz-noinst') === '1'; } catch (e) {}
  const addInstall = () => {
    if (standalone || hideInst || (!bip && !ios)) return;
    const st = document.querySelector('#view-painel > .stats'); if (!st || $('#instcard')) return;
    const d = document.createElement('section'); d.className = 'inst'; d.id = 'instcard'; d.dataset.tab = 'inicio';
    if (pui.tab && pui.tab !== 'inicio') d.classList.add('offtab');

    st.after(d);

  };

  addEventListener('appinstalled', () => { bip = null; const d = $('#instcard'); if (d) d.remove(); });
  const rp1 = renderPainel; renderPainel = function () { rp1.apply(this, arguments); addInstall(); };
  addInstall();
}
