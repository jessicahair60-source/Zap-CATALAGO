<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administração · Zap Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/site.css">
<style>
  body { background: #F7F4F6; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 10px; }
  .top small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 26px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .kpi b { display: block; font: 800 26px var(--f-display); font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12.5px; color: var(--muted); }
  .kpi.hl { background: #2A1A22; color: #fff; border-color: #2A1A22; } .kpi.hl span { color: #E7CFD9; }
  h2 { font-size: 18px; margin: 30px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tools .in { max-width: 320px; padding: 10px 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 12px; font: 600 13px var(--f-body); cursor: pointer; color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
  .list { display: grid; gap: 8px; }
  .row { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
  .row-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .row b { font-size: 15.5px; } .row .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; letter-spacing: .04em; text-transform: uppercase; }
  .t-pro { background: #E3F6EA; color: #137A3D; } .t-open, .t-trial { background: #EEE8FB; color: #5B3FA8; } .t-expired { background: #FFF4E5; color: var(--warn); } .t-blocked { background: #FDE7E4; color: var(--danger); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .acts button, .acts a { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 11px; font: 600 12.5px var(--f-body); cursor: pointer; color: var(--fg); text-decoration: none; }
  .acts .danger { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); } th { font-size: 12px; color: var(--muted); font-weight: 700; } tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; } th.num { text-align: right; }
  .empty { padding: 24px; text-align: center; color: var(--muted); background: var(--surface); border-radius: 16px; border: 1px dashed var(--line); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2A1A22; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 9; max-width: 90vw; }
  .tnote { margin: -4px 0 12px; color: var(--muted); font-size: 13.5px; }
  .trow { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  .trow video { width: 54px; height: 96px; border-radius: 10px; object-fit: cover; background: #2A1A22; flex: none; }
  .trow .ph { width: 54px; height: 96px; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 22px; flex: none; }
  .trow .tinfo { flex: 1; min-width: 0; }
  .trow .tinfo b { display: block; font-size: 15px; }
  .trow .tinfo small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .trow .acts { margin-top: 8px; }
  .t-ok { background: #E3F6EA; color: #137A3D; } .t-no { background: #F2ECEF; color: var(--muted); }
  @media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<div class="container">
  <div class="top"><div><small>Administração da plataforma</small><h1 id="brand">Zap Catálogo</h1></div>
    <div class="acts"><a href="/">Ver o site</a><a href="/sair?para=admin">Sair</a></div></div>

  <div class="kpis" id="kpis"></div>

  <h2>Lojas</h2>
  <div class="tools">
    <input class="in" id="q" type="search" placeholder="Buscar por loja, dona ou e-mail" aria-label="Buscar lojas">
    <div class="chips" id="chips"></div>
  </div>
  <div class="list" id="list"><div class="empty">Carregando...</div></div>

  <h2>Vídeos tutoriais do painel</h2>
  <p class="tnote">Cada vídeo aparece para as lojistas no lugar certo do painel. O botão só aparece onde já tem vídeo. Envie em pé (9:16), MP4.</p>
  <div class="list" id="tuts"><div class="empty">Carregando...</div></div>

  <h2>Pagamentos recentes</h2>
  <div id="pays"></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const date = t => t ? new Date(t).toLocaleDateString('pt-BR') : '';
const PLAN = { pro: 'Paga', open: 'Liberada', trial: 'Teste', expired: 'Vencida' };
let data = null, filter = 'all';
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3000); }

async function load() {
  const r = await fetch('/api/admin/overview');
  if (r.status === 403 || r.status === 401) { location.href = '/entrar'; return; }
  data = await r.json(); render();
}
function render() {
  const m = data.metrics; $('#brand').textContent = data.brand;
  $('#kpis').innerHTML = [
    ['hl', brl(m.mrr), 'Receita mensal recorrente'], ['', m.total, 'Lojas cadastradas'], ['', m.paying, 'Lojas pagando'], ['', m.newWeek, 'Novas nos últimos 7 dias'],
    ['', m.open, 'Liberadas (sem cobrança)'], ['', m.expired, 'Vencidas (fora do ar)'], ['', brl(m.revenue30), 'Recebido em 30 dias'], ['', m.views30.toLocaleString('pt-BR'), 'Visitas nas vitrines (30 dias)']
  ].map(([c, v, l]) => `<div class="kpi ${c}"><b>${v}</b><span>${l}</span></div>`).join('');
  const chips = [['all', `Todas (${m.total})`], ['pro', `Pagas (${m.paying})`], ['open', `Liberadas (${m.open})`], ['expired', `Vencidas (${m.expired})`], ['blocked', `Bloqueadas (${m.blocked})`]];
  $('#chips').innerHTML = chips.map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('');
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  const q = $('#q').value.trim().toLowerCase();
  const list = data.stores.filter(s => (filter === 'all' || (filter === 'blocked' ? s.blocked : s.plan === filter && !s.blocked)) && (!q || `${s.name} ${s.owner} ${s.email} ${s.slug}`.toLowerCase().includes(q)));
  $('#list').innerHTML = list.length ? list.map(s => `<div class="row">
    <div class="row-top"><div><b>${esc(s.name)}</b>
      <div class="meta">${esc(s.owner)} · ${esc(s.email)}</div>
      <div class="meta"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//, ''))}</a> · ${s.products} produtos · ${s.online ? 'no ar' : 'fora do ar'} · desde ${date(s.createdAt)}</div>
      <div class="meta">${s.plan === 'pro' ? `Paga até ${date(s.proUntil)}${s.subscribed ? ' · assinatura ativa' : ''}` : s.plan === 'open' ? 'Liberada · cobrança ainda não ligada' : 'Vencida · vitrine fora do ar'}${s.blocked ? ` · bloqueada${s.blockedReason ? ': ' + esc(s.blockedReason) : ''}` : ''}</div></div>
      <span class="tag ${s.blocked ? 't-blocked' : 't-' + s.plan}">${s.blocked ? 'Bloqueada' : PLAN[s.plan]}</span></div>
    <div class="acts">
      <a href="${esc(s.url)}" target="_blank" rel="noopener">Ver vitrine</a>
      <button data-a="givePro" data-id="${s.id}">Liberar 30 dias</button>
      <button data-a="giveYear" data-id="${s.id}">Liberar 1 ano</button>
      ${s.plan !== 'expired' ? `<button data-a="expire" data-id="${s.id}">Encerrar acesso</button>` : ''}
      <button data-a="resetLink" data-id="${s.id}">Link de senha nova</button>
      ${s.blocked ? `<button data-a="unblock" data-id="${s.id}">Desbloquear</button>` : `<button class="danger" data-a="block" data-id="${s.id}">Bloquear</button>`}
    </div></div>`).join('') : '<div class="empty">Nenhuma loja aqui.</div>';
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => act(+b.dataset.id, b.dataset.a));
  $('#pays').innerHTML = data.payments.length ? `<table><thead><tr><th>Data</th><th>Loja</th><th>Situação</th><th class="num">Valor</th></tr></thead><tbody>
    ${data.payments.map(p => `<tr><td>${date(p.created_at)}</td><td>${esc(p.name)}</td><td>${p.status === 'approved' ? 'Aprovado' : esc(p.status)}</td><td class="num">${brl(p.amount)}</td></tr>`).join('')}</tbody></table>`
    : '<div class="empty">Nenhum pagamento ainda.</div>';
}
async function act(id, action) {
  const s = data.stores.find(x => x.id === id); const body = { action };
  if (action === 'block') { const reason = prompt(`Bloquear ${s.name}? A vitrine sai do ar para as clientes. Motivo (opcional):`); if (reason === null) return; body.reason = reason; }
  if (action === 'expire' && !confirm(`Encerrar o acesso de ${s.name} agora? A vitrine sai do ar até ela assinar.`)) return;
  if (action === 'givePro') body.days = 30;
  if (action === 'giveYear') { body.action = 'givePro'; body.days = 366; }
  const r = await fetch(`/api/admin/stores/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return toast(j.error || 'Não deu certo.');
  if (j.link) prompt(`Link para ${s.owner} criar uma senha nova (vale 24 horas). Copie e mande para ela no WhatsApp:`, j.link);
  else if (j.tempPassword) prompt(`Senha nova de ${s.owner}. Envie para ela e peça para trocar no painel:`, j.tempPassword);
  else toast('Feito');
  load();
}
$('#q').oninput = () => data && render();
load();

/* Vídeos tutoriais: um lugar para cada passo do painel */
const TUTS = [['tour', 'Conheça o painel', 'Abre sozinho na 1ª vez que a lojista entra no painel'],
  ['p1', 'Passo 1 · Informações da loja', 'Aba Loja (abre sozinho na 1ª vez)'],
  ['p2', 'Passo 2 · Visual', 'Aba Visual (abre sozinho na 1ª vez)'],
  ['p3', 'Passo 3 · Cadastrar produto', 'Aba Produtos (abre sozinho na 1ª vez)'],
  ['link', 'Extra 1 · Como pegar o link da sua vitrine', 'Início, embaixo do link da vitrine'],
  ['banner', 'Extra 2 · Bônus: Como criar o seu banner', 'Aba Visual, dentro de Banner e logo'],
  ['vender', 'Extra 3 · Bônus: Como vender mais usando a sua vitrine', 'Início, no fim da página']];
let tutData = {};
const mmss = d => d ? `${Math.floor(d / 60)}:${String(Math.round(d % 60)).padStart(2, '0')}` : '';
async function loadTuts() {
  const r = await fetch('/api/admin/tutoriais'); if (!r.ok) return;
  tutData = (await r.json()).tutorials; renderTuts();
}
function renderTuts() {
  $('#tuts').innerHTML = TUTS.map(([k, t, where]) => { const v = tutData[k]; return `<div class="trow">
    ${v ? `<video src="${esc(v.url)}" muted playsinline preload="metadata"></video>` : '<div class="ph">▶</div>'}
    <div class="tinfo"><b>${esc(t)}</b><small>${esc(where)}</small>
      <small><span class="tag ${v ? 't-ok' : 't-no'}">${v ? 'No ar' : 'Sem vídeo'}</span>${v && v.dur ? ' · ' + mmss(v.dur) : ''}</small>
      <div class="acts"><button data-tup="${k}">${v ? 'Trocar vídeo' : 'Enviar vídeo'}</button>${v ? `<a href="${esc(v.url)}" target="_blank" rel="noopener">Assistir</a><button class="danger" data-tdel="${k}">Tirar</button>` : ''}</div></div></div>`; }).join('');
  document.querySelectorAll('[data-tup]').forEach(b => b.onclick = () => pickTut(b.dataset.tup, b));
  document.querySelectorAll('[data-tdel]').forEach(b => b.onclick = async () => {
    if (!confirm('Tirar este vídeo? O botão do tutorial some do painel das lojistas.')) return;
    const r = await fetch('/api/admin/tutoriais/' + b.dataset.tdel, { method: 'DELETE' }); const j = await r.json().catch(() => ({}));
    if (!r.ok) return toast(j.error || 'Não deu certo.'); tutData = j.tutorials; renderTuts(); toast('Vídeo tirado');
  });
}
function videoDur(file) { return new Promise(ok => { const v = document.createElement('video'); v.preload = 'metadata';
  v.onloadedmetadata = () => { ok(Math.round(v.duration) || 0); URL.revokeObjectURL(v.src); }; v.onerror = () => ok(0); v.src = URL.createObjectURL(file); }); }
function pickTut(key, btn) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/mp4,video/quicktime,video/webm';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    const dur = await videoDur(file);
    btn.disabled = true;
    const xhr = new XMLHttpRequest(); xhr.open('POST', `/api/admin/tutoriais/${key}?dur=${dur}`);
    xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');
    xhr.upload.onprogress = e => { if (e.lengthComputable) btn.textContent = `Enviando ${Math.round(e.loaded / e.total * 100)}%`; };
    xhr.onload = () => { let j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status !== 200) { toast(j.error || 'Não deu para enviar.'); renderTuts(); return; }
      tutData = j.tutorials; renderTuts(); toast('Vídeo no ar!'); };
    xhr.onerror = () => { toast('Sem conexão. Tente de novo.'); renderTuts(); };
    xhr.send(file);
  };
  inp.click();
}
loadTuts();
</script>
</body>
</html>
